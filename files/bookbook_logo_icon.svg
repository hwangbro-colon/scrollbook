<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- BookBook icon mark — app icon / favicon variant with filled background -->

  <!-- background -->
  <rect x="0" y="0" width="240" height="240" rx="52" fill="#2E2A6E"/>

  <!-- speech-bubble "open book" shape -->
  <path d="M70,158 L58,192 L96,160 Z" fill="#FFF9F2"/>
  <rect x="40" y="44" width="160" height="116" rx="28" fill="#FFF9F2"/>

  <!-- book spine (subtle gutter curve) -->
  <path d="M120,60 Q113,102 120,144" fill="none" stroke="#2E2A6E" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

  <!-- left page — "reader 1" text lines, indigo -->
  <line x1="58" y1="76"  x2="103" y2="76"  stroke="#2E2A6E" stroke-width="9" stroke-linecap="round"/>
  <line x1="58" y1="98"  x2="110" y2="98"  stroke="#2E2A6E" stroke-width="9" stroke-linecap="round"/>
  <line x1="58" y1="120" x2="96"  y2="120" stroke="#2E2A6E" stroke-width="9" stroke-linecap="round"/>

  <!-- right page — "reader 2" text lines, coral -->
  <line x1="137" y1="76"  x2="182" y2="76"  stroke="#FF6B4A" stroke-width="9" stroke-linecap="round"/>
  <line x1="137" y1="98"  x2="176" y2="98"  stroke="#FF6B4A" stroke-width="9" stroke-linecap="round"/>
  <line x1="137" y1="120" x2="182" y2="120" stroke="#FF6B4A" stroke-width="9" stroke-linecap="round"/>

  <!-- voice / sound waves, radiating from the bubble -->
  <path d="M196,58 Q214,45 196,28" fill="none" stroke="#FF6B4A" stroke-width="7" stroke-linecap="round"/>
  <path d="M204,64 Q230,42 204,16" fill="none" stroke="#FF6B4A" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
